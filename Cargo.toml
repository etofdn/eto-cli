[package]
name = "eto-cli"
version = "1.0.0"
edition = "2021"
description = "ETO Universal VM — Command Line Interface"
license = "MIT"
repository = "https://github.com/etofdn/eto-cli"

[[bin]]
name = "eto"
path = "src/main.rs"

[dependencies]
borsh = { version = "1.5", features = ["derive"] }
bs58 = "0.5"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[workspace]
